name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  APP_VERSION: "0.0.1"

jobs:
  test:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv ffmpeg
      - name: Rodar a suíte
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install .
          python tests/test_local.py

  build-windows:
    name: Windows (pacote pronto)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Baixar ffmpeg estático (vai embutido)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          curl.exe -L --fail --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-static -Force
          Copy-Item "ffmpeg-static\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" "bin\ffmpeg.exe"
          Copy-Item "ffmpeg-static\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" "bin\ffprobe.exe"
          .\bin\ffmpeg.exe -version | Select-Object -First 1
      - name: Instalar dependências de build
        run: python -m pip install ".[build]"
      - name: Gerar executável
        run: pyinstaller --noconfirm --clean HolyricsBot.spec
      - name: Empacotar
        shell: pwsh
        run: |
          Copy-Item config.example.json dist\HolyricsBot\config.example.json -Force
          Compress-Archive -Path dist\HolyricsBot\* -DestinationPath "HolyricsBot-Windows-$env:APP_VERSION.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: HolyricsBot-Windows-${{ env.APP_VERSION }}
          path: HolyricsBot-Windows-${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  build-linux:
    name: Linux (pacote pronto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xz-utils
      - name: Baixar ffmpeg estático (vai embutido)
        run: |
          mkdir -p bin /tmp/ffmpeg
          curl -L --fail --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          cp /tmp/ffmpeg/bin/ffmpeg bin/ffmpeg
          cp /tmp/ffmpeg/bin/ffprobe bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe
          ./bin/ffmpeg -version | head -1
      - name: Instalar dependências de build
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
      - name: Gerar binário
        run: |
          . .venv/bin/activate
          pyinstaller --noconfirm --clean HolyricsBot.spec
      - name: Empacotar (.tar.gz e AppImage)
        run: |
          set -e
          cp config.example.json dist/HolyricsBot/config.example.json
          tar -czf "HolyricsBot-Linux-${APP_VERSION}.tar.gz" -C dist HolyricsBot

          rm -rf AppDir
          mkdir -p AppDir
          cp -a dist/HolyricsBot AppDir/HolyricsBot
          cp packaging/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp packaging/appimage/holyrics-bot.desktop AppDir/holyrics-bot.desktop
          cp holyrics_bot/resources/icon.png AppDir/holyrics-bot.png

          curl -L --fail --retry 3 -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool --no-appstream AppDir \
            "HolyricsBot-Linux-${APP_VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: HolyricsBot-Linux-${{ env.APP_VERSION }}
          path: |
            HolyricsBot-Linux-${{ env.APP_VERSION }}.tar.gz
            HolyricsBot-Linux-${{ env.APP_VERSION }}-x86_64.AppImage
          if-no-files-found: error
