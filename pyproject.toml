[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holyrics-bot"
version = "0.0.1"
description = "Recebe arquivos do Telegram e salva nas pastas do Holyrics (app de bandeja)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "pypdfium2>=4.30",
    "python-pptx>=1.0",
    "Pillow>=10.0",
    "yt-dlp>=2025.1.1",
    "pystray>=0.19",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
holyrics-bot = "holyrics_bot.gui:main"

[tool.setuptools.packages.find]
include = ["holyrics_bot*"]

[tool.setuptools.package-data]
holyrics_bot = ["resources/*"]
