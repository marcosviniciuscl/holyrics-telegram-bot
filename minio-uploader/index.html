<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar arquivo grande</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0; padding: 24px;
    }
    .card { width: 100%; max-width: 460px; background: #1e293b; border-radius: 16px;
      padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    p.sub { margin: 0 0 20px; color: #94a3b8; font-size: .9rem; }
    form { margin: 0; }
    input[type=file] { display: none; }
    .drop {
      display: block; border: 2px dashed #475569; border-radius: 12px; padding: 28px 16px;
      text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.on { border-color: #38bdf8; background: #0b2536; }
    .drop strong { color: #e2e8f0; }
    .nome { margin-top: 12px; font-size: .85rem; color: #7dd3fc; word-break: break-all; }
    button {
      width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff;
    }
    button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: .95rem; line-height: 1.5; }
    .ok { color: #4ade80; }
    .erro { color: #f87171; }
    .barra { height: 8px; background: #334155; border-radius: 99px; overflow: hidden; margin-top: 16px; display: none; }
    .barra > i { display: block; height: 100%; width: 0; background: #38bdf8; transition: width .2s; }
    .rodape { margin-top: 18px; font-size: .75rem; color: #64748b; text-align: center; }
    .oculto { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="titulo">Enviar arquivo grande</h1>
    <p class="sub" id="subtitulo">O arquivo vai direto para o servidor de mídia.</p>

    <form id="form" method="post" enctype="multipart/form-data">
      <label class="drop" id="drop" for="arquivo">
        <strong>Toque para escolher</strong><br>ou arraste o arquivo aqui
        <div class="nome" id="nome"></div>
      </label>
      <input type="file" id="arquivo" name="file">
      <button type="submit" id="enviar" disabled>Enviar</button>
    </form>

    <div class="barra" id="barra"><i id="progresso"></i></div>
    <div class="msg" id="msg"></div>
    <div class="rodape">Seus arquivos vão direto para o seu servidor de mídia.</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const form = document.getElementById('form');
    const arquivo = document.getElementById('arquivo');
    const drop = document.getElementById('drop');
    const nome = document.getElementById('nome');
    const botao = document.getElementById('enviar');
    const msg = document.getElementById('msg');
    const barra = document.getElementById('barra');
    const progresso = document.getElementById('progresso');
    const titulo = document.getElementById('titulo');
    const subtitulo = document.getElementById('subtitulo');

    function mostrarErro(texto) {
      drop.classList.add('oculto');
      botao.classList.add('oculto');
      msg.className = 'msg erro';
      msg.innerHTML = texto;
    }

    async function obterDados() {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (!hash) return null;
      // Formato novo: token curto -> busca links/<token>.json no mesmo bucket.
      if (hash.length < 200) {
        try {
          const resp = await fetch('links/' + encodeURIComponent(hash) + '.json', { cache: 'no-store' });
          if (resp.ok) return await resp.json();
        } catch (e) { /* segue para o formato antigo */ }
      }
      // Formato antigo: JSON (com a assinatura) embutido no # em base64.
      try {
        let b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
        if (obj && obj.url && obj.fields) return obj;
      } catch (e) { /* ignora */ }
      return null;
    }

    function tamanho(bytes) {
      const u = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (bytes >= 1024 && i < u.length - 1) { bytes /= 1024; i++; }
      return bytes.toFixed(i ? 1 : 0) + ' ' + u[i];
    }

    (async () => {
      if (params.get('ok') === '1') {
        // Voltou do MinIO depois de enviar com sucesso.
        drop.classList.add('oculto');
        botao.classList.add('oculto');
        titulo.textContent = 'Arquivo recebido ✅';
        subtitulo.textContent = 'Pode voltar para o Telegram — o bot vai salvar o arquivo.';
        msg.className = 'msg ok';
        const chave = params.get('key') ? decodeURIComponent(params.get('key')) : '';
        msg.innerHTML = '✅ <strong>Envio concluído!</strong><br>'
          + (chave ? 'Arquivo: <code>' + chave.split('/').pop() + '</code><br>' : '')
          + 'O bot já está baixando e salvando na pasta certa.';
        return;
      }

      const dados = await obterDados();
      if (!dados || !dados.url || !dados.fields) {
        mostrarErro('⚠️ <strong>Link inválido ou expirado.</strong><br>'
          + 'Peça um novo link ao bot no Telegram.');
        return;
      }

      form.action = dados.url;
      // Campos assinados antes do campo do arquivo (o arquivo precisa ser o último).
      for (const [campo, valor] of Object.entries(dados.fields)) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = campo;
        input.value = valor;
        form.insertBefore(input, arquivo);
      }

      arquivo.addEventListener('change', () => {
        if (arquivo.files.length) {
          nome.textContent = arquivo.files[0].name + ' — ' + tamanho(arquivo.files[0].size);
          botao.disabled = false;
        } else {
          nome.textContent = '';
          botao.disabled = true;
        }
      });

      ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
        e.preventDefault(); drop.classList.add('on');
      }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
        e.preventDefault(); drop.classList.remove('on');
      }));
      drop.addEventListener('drop', e => {
        if (e.dataTransfer.files.length) {
          arquivo.files = e.dataTransfer.files;
          arquivo.dispatchEvent(new Event('change'));
        }
      });

      form.addEventListener('submit', () => {
        botao.disabled = true;
        barra.style.display = 'block';
        msg.className = 'msg';
        msg.textContent = 'Enviando… não feche esta página.';
        let p = 0;
        setInterval(() => { p = Math.min(95, p + 3); progresso.style.width = p + '%'; }, 400);
      });
    })();
  </script>
</body>
</html>
