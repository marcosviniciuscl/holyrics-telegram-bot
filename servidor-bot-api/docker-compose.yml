# Alternativa ao serviço nativo: roda o servidor local do Bot API em Docker.
# A pasta /var/lib/telegram-bot-api é montada no MESMO caminho no host para que
# o bot consiga ler os arquivos pelo caminho absoluto que o getFile devolve.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"
    volumes:
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:8081:8081"
